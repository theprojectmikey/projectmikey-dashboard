        unique_id: sr_kitchen_coffee_sw
        state: "{{ is_state('input_boolean.sr_kitchen_coffee','on') }}"
        turn_on:
          action: input_boolean.turn_on
          target: {entity_id: input_boolean.sr_kitchen_coffee}
        turn_off:
          action: input_boolean.turn_off
          target: {entity_id: input_boolean.sr_kitchen_coffee}
      - name: "Humidifier"
        unique_id: sr_nursery_humid_sw
        state: "{{ is_state('input_boolean.sr_nursery_humid','on') }}"
        turn_on:
          action: input_boolean.turn_on
          target: {entity_id: input_boolean.sr_nursery_humid}
        turn_off:
          action: input_boolean.turn_off
          target: {entity_id: input_boolean.sr_nursery_humid}
      - name: "Baby Monitor"
        unique_id: sr_nursery_monitor_sw
        state: "{{ is_state('input_boolean.sr_nursery_monitor','on') }}"
        turn_on:
          action: input_boolean.turn_on
          target: {entity_id: input_boolean.sr_nursery_monitor}
        turn_off:
          action: input_boolean.turn_off
          target: {entity_id: input_boolean.sr_nursery_monitor}
