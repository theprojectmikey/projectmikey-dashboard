  - cover:
      - name: "Living Blinds"
        unique_id: sr_living_blinds
        device_class: blind
        position: "{{ states('input_number.sr_living_blinds_pos')|int(0) }}"
        open_cover:
          action: input_number.set_value
          target: {entity_id: input_number.sr_living_blinds_pos}
          data: {value: 100}
        close_cover:
          action: input_number.set_value
          target: {entity_id: input_number.sr_living_blinds_pos}
          data: {value: 0}
        stop_cover:
          action: input_number.set_value
          target: {entity_id: input_number.sr_living_blinds_pos}
          data: {value: "{{ states('input_number.sr_living_blinds_pos')|int(0) }}"}
        set_cover_position:
          action: input_number.set_value
          target: {entity_id: input_number.sr_living_blinds_pos}
          data: {value: "{{ position }}"}
      - name: "Bedroom Blinds"
        unique_id: sr_bed_blinds
        device_class: blind
