        unique_id: sr_heater_sw
        state: "{{ is_state('input_boolean.sr_heater','on') }}"
        turn_on:
          action: input_boolean.turn_on
          target: {entity_id: input_boolean.sr_heater}
        turn_off:
          action: input_boolean.turn_off
          target: {entity_id: input_boolean.sr_heater}

  - lock:
      - name: "Front Door"
        unique_id: sr_front_lock
        state: "{{ 'locked' if is_state('input_boolean.sr_front_locked','on') else 'unlocked' }}"
        lock:
          action: input_boolean.turn_on
          target: {entity_id: input_boolean.sr_front_locked}
        unlock:
          action: input_boolean.turn_off
          target: {entity_id: input_boolean.sr_front_locked}

  - binary_sensor:
      - name: "Front Door"
        unique_id: sr_entry_door
        device_class: door
        state: "{{ is_state('input_boolean.sr_entry_door','on') }}"
      - name: "Entry Motion"
        unique_id: sr_entry_motion
        device_class: motion
        state: "{{ is_state('input_boolean.sr_entry_motion','on') }}"
      - name: "Nursery Motion"
        unique_id: sr_nursery_motion
        device_class: motion
        state: "{{ is_state('input_boolean.sr_nursery_motion','on') }}"
      - name: "Kitchen Leak"
        unique_id: sr_kitchen_leak
        device_class: moisture
        state: "{{ is_state('input_boolean.sr_kitchen_leak','on') }}"
      - name: "Doorbell"
        unique_id: sr_entry_bell
        device_class: occupancy
        state: "{{ is_state('input_boolean.sr_entry_bell','on') }}"

  - sensor:
      - name: "Living Room Temperature"
        unique_id: sr_living_temp
        state: "{{ states('input_number.sr_living_temp')|float(72) | round(1) }}"
        unit_of_measurement: "°F"
        device_class: temperature
        state_class: measurement
      - name: "Kitchen Temperature"
        unique_id: sr_kitchen_temp
        state: "{{ states('input_number.sr_kitchen_temp')|float(73) | round(1) }}"
        unit_of_measurement: "°F"
        device_class: temperature
        state_class: measurement
      - name: "Bedroom Temperature"
        unique_id: sr_bed_temp
        state: "{{ states('input_number.sr_bed_temp')|float(69) | round(1) }}"
        unit_of_measurement: "°F"
        device_class: temperature
        state_class: measurement
      - name: "Nursery Temperature"
        unique_id: sr_nursery_temp
        state: "{{ states('input_number.sr_nursery_temp')|float(71) | round(1) }}"
        unit_of_measurement: "°F"
        device_class: temperature
        state_class: measurement
      - name: "Living Room Humidity"
        unique_id: sr_living_hum
        state: "43"
        unit_of_measurement: "%"
        device_class: humidity
        state_class: measurement
      - name: "Kitchen Humidity"
        unique_id: sr_kitchen_hum
        state: "47"
        unit_of_measurement: "%"
        device_class: humidity
        state_class: measurement
      - name: "Bedroom Humidity"
        unique_id: sr_bed_hum
        state: "41"
        unit_of_measurement: "%"
        device_class: humidity
        state_class: measurement
      - name: "Nursery Humidity"
        unique_id: sr_nursery_hum
        state: "45"
        unit_of_measurement: "%"
        device_class: humidity
        state_class: measurement

climate:
  - platform: generic_thermostat
    name: Thermostat
    unique_id: sr_thermostat
    heater: switch.showroom_heat_call
    target_sensor: sensor.living_room_temperature
    min_temp: 55
    max_temp: 85
    target_temp: 71
    cold_tolerance: 0.5
    hot_tolerance: 0.5
    initial_hvac_mode: heat
    precision: 0.5

scene:
  - name: Good Morning
    id: sr_sc_morning
    icon: mdi:weather-sunset-up
    entities:
      light.ceiling: {state: on, brightness: 220}
      light.lamp: {state: off}
      light.floor_lamp: {state: off}
      light.under_cabinet: {state: on, brightness: 200}
      light.island: {state: off}
      light.bedroom_ceiling: {state: on, brightness: 150}
      light.bedside: {state: off}
      light.night_light: {state: off}
      light.hallway: {state: on, brightness: 200}
      cover.living_blinds: {state: open, current_position: 100}
      cover.bedroom_blinds: {state: open, current_position: 100}
      cover.kitchen_blinds: {state: open, current_position: 100}
      lock.front_door: locked
  - name: Movie Night
