  - fan:
      - name: "Living Fan"
        unique_id: sr_living_fan
        state: "{{ is_state('input_boolean.sr_living_fan','on') }}"
        percentage: "{{ states('input_number.sr_living_fan_pct')|int(0) }}"
        speed_count: 3
        turn_on:
          action: input_boolean.turn_on
          target: {entity_id: input_boolean.sr_living_fan}
        turn_off:
          action: input_boolean.turn_off
          target: {entity_id: input_boolean.sr_living_fan}
        set_percentage:
          - action: input_number.set_value
            target: {entity_id: input_number.sr_living_fan_pct}
            data: {value: "{{ percentage }}"}
          - action: "input_boolean.turn_{{ 'on' if percentage | int > 0 else 'off' }}"
            target: {entity_id: input_boolean.sr_living_fan}
      - name: "Bedroom Fan"
        unique_id: sr_bed_fan
        state: "{{ is_state('input_boolean.sr_bed_fan','on') }}"
        percentage: "{{ states('input_number.sr_bed_fan_pct')|int(0) }}"
        speed_count: 3
        turn_on:
          action: input_boolean.turn_on
          target: {entity_id: input_boolean.sr_bed_fan}
        turn_off:
          action: input_boolean.turn_off
          target: {entity_id: input_boolean.sr_bed_fan}
        set_percentage:
          - action: input_number.set_value
            target: {entity_id: input_number.sr_bed_fan_pct}
            data: {value: "{{ percentage }}"}
          - action: "input_boolean.turn_{{ 'on' if percentage | int > 0 else 'off' }}"
            target: {entity_id: input_boolean.sr_bed_fan}

  - switch:
