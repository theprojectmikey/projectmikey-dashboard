# ============================================================================
# ProjectMikey — Showroom
#
# Simulated devices for sales demos. Core Home Assistant template entities
# backed by helpers, so they behave like real hardware: lights dim and change
# colour, blinds travel to a position, fans have speeds, the lock locks.
# Nothing here touches hardware.
#
# Self-contained. Delete this one file, restart, and every trace is gone.
# Real devices are never referenced: switch.smart_switch, the Third Reality
# plug and media_player.living_room_tv are untouched.
#
# Every helper id starts with sr_ so the fake half is always obvious.
# ============================================================================

input_boolean:
  sr_living_ceiling: {name: "Ceiling"}
  sr_living_lamp: {name: "Lamp"}
  sr_living_floor: {name: "Floor Lamp"}
  sr_kitchen_undercab: {name: "Under Cabinet"}
  sr_kitchen_island: {name: "Island"}
  sr_bed_ceiling: {name: "Bedroom Ceiling"}
  sr_bed_bedside: {name: "Bedside"}
  sr_nursery_night: {name: "Night Light"}
  sr_entry_hall: {name: "Hallway"}
  sr_living_fan: {name: "Living Fan"}
  sr_bed_fan: {name: "Bedroom Fan"}
  sr_kitchen_coffee: {name: "Coffee Maker"}
  sr_nursery_humid: {name: "Humidifier"}
  sr_nursery_monitor: {name: "Baby Monitor"}
  sr_entry_door: {name: "Front Door"}
  sr_entry_motion: {name: "Entry Motion"}
  sr_nursery_motion: {name: "Nursery Motion"}
  sr_kitchen_leak: {name: "Kitchen Leak"}
  sr_entry_bell: {name: "Doorbell"}
  sr_front_locked: {name: "Front Door Locked", initial: true}
  sr_heater: {name: "Heat Call"}

input_number:
  sr_living_ceiling_lvl: {name: "Ceiling Level", min: 0, max: 255, initial: 170, step: 1, mode: slider}
  sr_living_lamp_lvl: {name: "Lamp Level", min: 0, max: 255, initial: 170, step: 1, mode: slider}
  sr_living_lamp_cr: {name: "Lamp cr", min: 0, max: 255, initial: 255, step: 1, mode: box}
  sr_living_lamp_cg: {name: "Lamp cg", min: 0, max: 255, initial: 176, step: 1, mode: box}
  sr_living_lamp_cb: {name: "Lamp cb", min: 0, max: 255, initial: 108, step: 1, mode: box}
  sr_living_floor_lvl: {name: "Floor Lamp Level", min: 0, max: 255, initial: 170, step: 1, mode: slider}
  sr_kitchen_undercab_lvl: {name: "Under Cabinet Level", min: 0, max: 255, initial: 170, step: 1, mode: slider}
  sr_kitchen_island_lvl: {name: "Island Level", min: 0, max: 255, initial: 170, step: 1, mode: slider}
  sr_kitchen_island_cr: {name: "Island cr", min: 0, max: 255, initial: 255, step: 1, mode: box}
  sr_kitchen_island_cg: {name: "Island cg", min: 0, max: 255, initial: 176, step: 1, mode: box}
  sr_kitchen_island_cb: {name: "Island cb", min: 0, max: 255, initial: 108, step: 1, mode: box}
  sr_bed_ceiling_lvl: {name: "Bedroom Ceiling Level", min: 0, max: 255, initial: 170, step: 1, mode: slider}
  sr_bed_bedside_lvl: {name: "Bedside Level", min: 0, max: 255, initial: 170, step: 1, mode: slider}
  sr_nursery_night_lvl: {name: "Night Light Level", min: 0, max: 255, initial: 170, step: 1, mode: slider}
  sr_nursery_night_cr: {name: "Night Light cr", min: 0, max: 255, initial: 255, step: 1, mode: box}
  sr_nursery_night_cg: {name: "Night Light cg", min: 0, max: 255, initial: 176, step: 1, mode: box}
  sr_nursery_night_cb: {name: "Night Light cb", min: 0, max: 255, initial: 108, step: 1, mode: box}
  sr_entry_hall_lvl: {name: "Hallway Level", min: 0, max: 255, initial: 170, step: 1, mode: slider}
  sr_living_blinds_pos: {name: "Living Blinds Position", min: 0, max: 100, initial: 100, step: 1, mode: slider}
  sr_bed_blinds_pos: {name: "Bedroom Blinds Position", min: 0, max: 100, initial: 0, step: 1, mode: slider}
  sr_kitchen_blinds_pos: {name: "Kitchen Blinds Position", min: 0, max: 100, initial: 60, step: 1, mode: slider}
  sr_living_fan_pct: {name: "Living Fan Speed", min: 0, max: 100, initial: 66, step: 33, mode: slider}
  sr_bed_fan_pct: {name: "Bedroom Fan Speed", min: 0, max: 100, initial: 66, step: 33, mode: slider}
  sr_living_temp: {name: "Living Room Temp", min: 50, max: 90, initial: 72, step: 0.5, mode: box}
  sr_kitchen_temp: {name: "Kitchen Temp", min: 50, max: 90, initial: 73, step: 0.5, mode: box}
  sr_bed_temp: {name: "Bedroom Temp", min: 50, max: 90, initial: 69, step: 0.5, mode: box}
  sr_nursery_temp: {name: "Nursery Temp", min: 50, max: 90, initial: 71, step: 0.5, mode: box}

template:
  - light:
      - name: "Ceiling"
        unique_id: sr_living_ceiling
        state: "{{ is_state('input_boolean.sr_living_ceiling','on') }}"
        level: "{{ states('input_number.sr_living_ceiling_lvl')|int(0) }}"
        turn_on:
          action: input_boolean.turn_on
          target: {entity_id: input_boolean.sr_living_ceiling}
        turn_off:
          action: input_boolean.turn_off
          target: {entity_id: input_boolean.sr_living_ceiling}
        set_level:
          - action: input_number.set_value
            target: {entity_id: input_number.sr_living_ceiling_lvl}
            data: {value: "{{ brightness }}"}
          - action: "input_boolean.turn_{{ 'on' if brightness | int > 0 else 'off' }}"
            target: {entity_id: input_boolean.sr_living_ceiling}
      - name: "Lamp"
        unique_id: sr_living_lamp
        state: "{{ is_state('input_boolean.sr_living_lamp','on') }}"
        level: "{{ states('input_number.sr_living_lamp_lvl')|int(0) }}"
        rgb: "{{ (states('input_number.sr_living_lamp_cr')|int(255), states('input_number.sr_living_lamp_cg')|int(255), states('input_number.sr_living_lamp_cb')|int(255)) }}"
        turn_on:
          action: input_boolean.turn_on
          target: {entity_id: input_boolean.sr_living_lamp}
        turn_off:
